nodeLinker: node-modules

# primevue and @primevue/icons depend on packages that peer-depend on vue
# (@primevue/core, @primeicons/vue) but don't declare vue as a peer themselves,
# so the peer requirement can't be forwarded from this project.
packageExtensions:
  "primevue@*":
    peerDependencies:
      vue: "^3.5.0"
  "@primevue/icons@*":
    peerDependencies:
      vue: "^3.5.0"
